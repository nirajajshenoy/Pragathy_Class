<head>

<body bgcolor="maroon"><center>
    <h2>Add Course</h2>
<table cellspacing="20">
    <form>
    <tr>
        <td>Course Name :</td>

            <input type="text" placeholder="enter course id" required>

    </tr>

            </select>

        <td>Course Fee : </td>
    
      <td>  <select name="price" required>

            <option name="price3">Price3</option>
            

        </select>

    </tr>
    <tr>

            <input type="radio" name="Gender" value="Male">Male
             <input type="radio" name="Gender" value="Female">Female
              <input type="radio" name="Gender" value="Others">Others
        </td>
    </tr>
    <tr>
        <td>Education :</td>
        <td>
            <input type="checkbox" value="ug">UG
            <input type="checkboX"  value="Pg">PG
        </td>
    </tr>
    <tr>

        <td>
            <input type="email" placeholder="enter your mailid" required>

        </td>
    
    </tr>
    <tr>
        <td>Password :</td>
        <td>
            <input type="password" placeholder="enter password" required>
        </td>
    </tr>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
        <td>
            <input type="submit" name="submit" value="Add course">
            <input type="reset" name="reset" value="Reset">
        </td>
    </tr>
    
</table>
</center>
</form>
</body>
</body>
